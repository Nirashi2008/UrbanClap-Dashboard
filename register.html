
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanClap | Provider Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-info">
            <div class="brand">UrbanClap</div>

            <div class="info-content">
                <h1>Join UrbanClap</h1>
                <p>Create your provider account and grow your service business.</p>

                <div class="feature"><span>✓</span> Manage your customers</div>
                <div class="feature"><span>✓</span> Receive new bookings</div>
                <div class="feature"><span>✓</span> Grow your business</div>
            </div>
        </div>

        <div class="login-section">
            <div class="login-card">

                <div class="mobile-logo">UrbanClap</div>

                <h2>Create Account</h2>
                <p class="login-subtitle">Register as a service provider</p>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" required
                               placeholder="Enter first name">
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" required
                               placeholder="Enter last name">
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required
                               placeholder="Choose a username">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required
                               placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone"
                               placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label for="service_category">Service Category</label>
                        <input type="text" id="service_category" required
                               placeholder="e.g. Electrician, Plumber, Salon">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required
                               minlength="8" placeholder="Minimum 8 characters">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" required
                               placeholder="Confirm your password">
                    </div>

                    <button type="submit" class="login-btn">
                        Create Account
                    </button>

                    <p id="registerMessage"
                       style="text-align:center; margin-top:15px;">
                    </p>

                </form>

                <p style="text-align:center; margin-top:20px;">
                    Already have an account?
                    <a href="index.html"
                       style="color:#693cff; font-weight:600; text-decoration:none;">
                        Login
                    </a>
                </p>

            </div>
        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
